<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kompass</title>
<meta name="description" content="Persönliche Planung für Ziele, Routinen, Finanzen und Körper.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kompass">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}</style>
</head>
<body>

<style>
/* Layout: iOS-artige Oberfläche – große Titel, gruppierte Listen, Tab-Leiste unten, Sheets von unten; eine Spalte, max. 620px */
:root{
  --bg:#F2F2F7;--cell:#FFFFFF;--cell2:#E5E5EA;--segOn:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.2);--fill:rgba(120,120,128,.12);
  --bar:rgba(249,249,249,.86);--act:rgba(255,255,255,.96);--toast:rgba(28,28,30,.94);--toastFg:#FFFFFF;--onc:#FFFFFF;
  --tint:#007AFF;--orange:#FF9500;--teal:#30B0C7;--green:#34C759;--blue:#007AFF;--pink:#FF2D55;--purple:#AF52DE;--indigo:#5856D6;--red:#FF3B30;--cyan:#32ADE6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--cell:#1C1C1E;--cell2:#2C2C2E;--segOn:#636366;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);
  --bar:rgba(22,22,24,.86);--act:rgba(44,44,46,.97);--toast:rgba(58,58,60,.96);--toastFg:#FFFFFF;
  --tint:#0A84FF;--orange:#FF9F0A;--teal:#40C8E0;--green:#30D158;--blue:#0A84FF;--pink:#FF375F;--purple:#BF5AF2;--indigo:#5E5CE6;--red:#FF453A;--cyan:#64D2FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--cell:#1C1C1E;--cell2:#2C2C2E;--segOn:#636366;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);
  --bar:rgba(22,22,24,.86);--act:rgba(44,44,46,.97);--toast:rgba(58,58,60,.96);--toastFg:#FFFFFF;
  --tint:#0A84FF;--orange:#FF9F0A;--teal:#40C8E0;--green:#30D158;--blue:#0A84FF;--pink:#FF375F;--purple:#BF5AF2;--indigo:#5E5CE6;--red:#FF453A;--cyan:#64D2FF;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.41px;-webkit-font-smoothing:antialiased}
main{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:6px calc(100px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}

/* Kopf */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.lt h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0;text-wrap:balance;min-width:0}
.eyebrow{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--label2);letter-spacing:-.08px}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.back{color:var(--tint);display:flex;align-items:center;min-height:44px;margin-left:-4px}
.chevl{width:11px;height:11px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);margin:0 3px 0 6px}
.lnk{color:var(--tint);min-height:44px;font-size:17px}

/* Gruppen & Zeilen */
.sec{margin-top:26px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px 8px}
.sh h2{font-size:20px;line-height:25px;font-weight:700;margin:0;letter-spacing:.38px;display:flex;align-items:center;gap:8px;min-width:0}
.sh .lnk{font-size:15px;min-height:0;flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.grp{background:var(--cell);border-radius:12px;overflow:hidden}
.sf{font-size:13px;line-height:18px;color:var(--label2);margin:7px 16px 0}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.row+.row:has(>.ico,>.chk,>.mini)::before{left:57px}
.tap{cursor:pointer}
.tap:active{background:var(--cell2)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t1{overflow-wrap:anywhere}
.t2{font-size:15px;line-height:20px;color:var(--label2);letter-spacing:-.24px}
.rv{color:var(--label2);flex:none;text-align:right;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.chev{width:8px;height:8px;border-right:2px solid var(--label3);border-top:2px solid var(--label3);transform:rotate(45deg);flex:none;margin-right:3px}
.ico{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px;fill:none;stroke:var(--onc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.plain{background:var(--fill)}.ico.plain svg{stroke:var(--tint)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--label3);flex:none;display:grid;place-items:center}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on::after{content:"";width:10px;height:5px;border-left:2.4px solid var(--onc);border-bottom:2.4px solid var(--onc);transform:translateY(-1px) rotate(-45deg)}
.mini{flex:none;display:block}
.pill{background:var(--fill);color:var(--tint);font-size:15px;font-weight:600;padding:0 14px;border-radius:999px;min-height:32px;flex:none;white-space:nowrap}
.pill.on{background:var(--green);color:var(--onc)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.dim .t1{color:var(--label2)}
.neg{color:var(--red)}.pos{color:var(--green)}
.tint .t1{color:var(--tint)}.red .t1,.red{color:var(--red)}
.center{justify-content:center;text-align:center}

/* Karten */
.card{background:var(--cell);border-radius:12px;padding:16px;margin-top:16px}
.big{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;font-variant-numeric:tabular-nums}
.big small{font-size:17px;font-weight:600;color:var(--label2);letter-spacing:-.41px}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.kv3 span{display:block;font-size:13px;color:var(--label2)}
.kv3 b{font-size:17px;font-variant-numeric:tabular-nums;font-weight:600}
.rings{display:flex;align-items:center;gap:22px;position:relative}
.rings.tap:active{background:var(--cell)}
.info{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label3);color:var(--label2);font-size:13px;font-weight:700;display:grid;place-items:center;font-style:italic;font-family:Georgia,serif}
.lead{font-size:20px;line-height:26px;font-weight:600;letter-spacing:.38px;margin:12px 4px 4px;text-wrap:balance}
.btnp{display:block;width:100%;min-height:50px;border-radius:12px;background:var(--tint);color:var(--onc);font-size:17px;font-weight:600;margin-top:24px}
.btnp:active{opacity:.8}
.nxl{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:.5px solid var(--sep);display:grid;gap:6px}
.nxl li{display:flex;gap:10px;font-size:15px;color:var(--label2);min-width:0}
.nxl .tm{width:auto}
.rings svg{flex:none}
.rings dl{margin:0;display:grid;gap:8px;min-width:0}
.rings dt{font-size:15px;font-weight:600}
.rings dd{margin:0;font-size:22px;line-height:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.35px}
.rings dd small{font-size:15px;color:var(--label2);font-weight:500;letter-spacing:-.24px}
.note{background:var(--cell);border-radius:12px;padding:10px 16px;margin-top:12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.note .lnk{font-size:15px;min-height:32px;font-weight:600;flex:none}
.jt{display:flex;flex-direction:column;gap:2px}
.jh{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px}
.jact{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.mnav b{font-size:17px;font-weight:600}
.mnav button{color:var(--tint);font-size:28px;line-height:1;min-width:44px;min-height:44px}
.chart{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.ax{font-size:10px;fill:var(--label2);letter-spacing:0}
.tm{font-variant-numeric:tabular-nums;color:var(--label2);width:46px;flex:none;font-size:15px}
.past .t1,.past .tm{color:var(--label3)}
.nowrow{background:var(--fill)}
.buf .t1{color:var(--label2);font-size:15px}

/* Segment, Schalter, Chips */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin-top:14px}
.seg button{flex:1;min-width:0;min-height:32px;border-radius:7px;font-size:13px;font-weight:500;letter-spacing:-.08px;padding:0 4px}
.seg button.on{background:var(--segOn);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .2s}
.sw:checked{background:var(--green)}.sw:checked::after{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chip{min-width:42px;min-height:36px;padding:0 10px;border-radius:18px;background:var(--fill);font-size:15px;font-weight:500}
.chip.on{background:var(--tint);color:var(--onc)}
.cdot{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.cdot.on{box-shadow:0 0 0 2px var(--cell),0 0 0 4px var(--label2)}
.stars{display:flex;gap:4px}.stars button{font-size:26px;color:var(--label3);min-width:34px;min-height:40px}.stars button.on{color:var(--orange)}

/* Formulare im Sheet */
.fr{cursor:text}
.fr>.t1{flex:none;max-width:55%}
.fi{flex:1;min-width:0;border:0;background:none;color:var(--label2);text-align:right;padding:0;min-height:24px;outline:none}
.fi:focus{color:var(--label)}
select.fi{appearance:none;-webkit-appearance:none;color:var(--tint);cursor:pointer;text-align-last:right;direction:ltr}
input[type=date].fi,input[type=time].fi{color:var(--tint);-webkit-appearance:none;appearance:none;display:flex;justify-content:flex-end}
.fa{width:100%;border:0;background:none;color:var(--label);resize:vertical;min-height:72px;outline:none;padding:0}
.err{color:var(--red);font-size:13px;margin:8px 16px 0}

/* Sheet & Aktionsblatt */
.lay{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:calc(100% - 44px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:up .34s cubic-bezier(.2,.85,.25,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;flex:none}
.sheet header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;min-height:50px;flex:none}
.sheet header b{font-size:17px;font-weight:600;text-align:center}
.sheet header button{color:var(--tint);min-height:44px;justify-self:start}
.sheet header button.ok{justify-self:end;font-weight:600}
.sbody{overflow:auto;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.sbody .sec:first-child{margin-top:8px}
.acts{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:430px;margin:0 auto;display:grid;gap:8px;animation:up .3s cubic-bezier(.2,.85,.25,1)}
.ag{background:var(--act);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px;overflow:hidden;text-align:center}
.ag p{margin:0;padding:14px 16px;font-size:13px;color:var(--label2);border-bottom:.5px solid var(--sep)}
.ag button{width:100%;min-height:56px;font-size:20px;color:var(--tint)}
.ag button.red{color:var(--red)}.ag.cancel button{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:6px}
.tile{background:var(--cell);border-radius:12px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;letter-spacing:-.08px}
.tile .ico{width:42px;height:42px;border-radius:11px}.tile .ico svg{width:22px;height:22px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:430px;margin:0 auto;background:var(--toast);color:var(--toastFg);border-radius:14px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:40;font-size:15px;min-height:48px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .3s}
.toast button{color:var(--cyan);font-weight:600;min-height:32px}
@keyframes up{from{transform:translateY(110%)}}
@keyframes fade{from{opacity:0}}

/* Tab-Leiste */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0 4px;min-height:52px;font-size:10px;font-weight:500;color:var(--label2);letter-spacing:.1px}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--tint)}
nav .plus span{width:42px;height:42px;border-radius:50%;background:var(--tint);display:grid;place-items:center}
nav .plus svg{stroke:var(--onc);stroke-width:2.4;width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main id="app"></main>
<nav aria-label="Hauptnavigation"><div class="in" id="nav"></div></nav>
<div id="sheet"></div>
<div id="ask"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
/* ════════ HILFSFUNKTIONEN ════════ */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>new Date(s+'T12:00:00');
const T=()=>iso(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const wdi=s=>(pd(s).getDay()+6)%7;                 // Montag = 0
const wk=s=>addD(s,-wdi(s));                       // Wochenbeginn (Montag)
const mLen=(y,m)=>new Date(y,m,0).getDate();       // m = 1..12
const addM=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5,7)+n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)};
const tm=s=>{const p=String(s||'0:0').split(':');return (+p[0])*60+(+p[1]||0)};
const ft=n=>pad(Math.floor(n/60)%24)+':'+pad(n%60);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);
const nf=(n,d=1)=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:d}).format(n||0);
const dde=s=>s?pd(s).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'–';
const dlong=s=>pd(s).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const dshort=s=>pd(s).toLocaleDateString('de-DE',{weekday:'short'}).replace('.','');
const mname=ym=>pd(ym+'-15').toLocaleDateString('de-DE',{month:'long',year:'numeric'});
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const PAL=['orange','teal','green','blue','pink','purple','indigo','red','cyan'];
const TYPES={daily:'Tägliche Zeit',habit:'Gewohnheit',num:'Betrag erreichen',prog:'Menge abarbeiten',proj:'Projekt mit Schritten'};
const TDESC={daily:'Jeden Tag eine feste Zeit investieren, z. B. 45 Minuten Claude Code.',habit:'Etwas Kleines, das du an bestimmten Tagen abhakst, z. B. Meditation.',num:'Eine Zahl oder Summe erreichen, z. B. 2.100 € Notgroschen.',prog:'Eine Menge Stück für Stück abarbeiten, z. B. 500 Vokabeln.',proj:'Ein größeres Vorhaben mit einzelnen Schritten zum Abhaken.'};
const ICONS={
  code:'M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16',
  spark:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z',
  euro:'M17.5 6.5a7 7 0 1 0 0 11M4 10h10M4 14h10',
  lang:'M4 5h9M8.5 3v2M6 5c0 4 2.5 7 6 8.5M11 5c-1 4.5-4 7.5-7 8.5M13 21l4-10 4 10M14.6 17.5h4.8',
  heart:'M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z',
  book:'M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3',
  flame:'M12 21c-3.6 0-6-2.6-6-6 0-3.8 3.6-5.6 4-10 2.8 1.8 5 5 5 8 .8-.6 1.3-1.6 1.4-2.8C17.7 11.6 18 13.4 18 15c0 3.4-2.4 6-6 6z',
  moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
  bolt:'M13 2.5L4.5 13.5H11l-1 8 8.5-11H12z',
  target:'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 1 0 0-9M12 11.2a.8.8 0 1 0 0 1.6.8.8 0 1 0 0-1.6',

function bars(vals,labels,color,targets){
  const W=300,H=118,top=8,bot=20,ch=H-top-bot,n=vals.length,mx=Math.max(1,...vals,...(targets||[]))*1.08,bw=W/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">`;
  vals.forEach((v,i)=>{const h=ch*v/mx,x=i*bw+bw*.2,w=bw*.6;
    s+=`<rect x="${x.toFixed(1)}" y="${(top+ch-h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="4" fill="var(--${color})" fill-opacity="${i===n-1?1:.5}"/>`;
    if(targets&&targets[i]){const ty=top+ch-ch*targets[i]/mx;s+=`<line x1="${(x-3).toFixed(1)}" x2="${(x+w+3).toFixed(1)}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="var(--label2)" stroke-width="1.5" stroke-dasharray="3 2"/>`}
    s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-5}" text-anchor="middle" class="ax">${labels[i]}</text>`});
  return s+'</svg>'}
function lineCh(pts,target){
  if(pts.length<2)return '';
  const W=300,H=130,l=34,r=10,t=10,b=22,vs=pts.map(p=>p.kg).concat(target?[target]:[]);
  const mn=Math.floor(Math.min(...vs)-.5),mx=Math.ceil(Math.max(...vs)+.5);
  const X=i=>l+(W-l-r)*i/(pts.length-1),Y=v=>t+(H-t-b)*(1-(v-mn)/(mx-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">`;
  [mn,(mn+mx)/2,mx].forEach(v=>{s+=`<line x1="${l}" x2="${W-r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--sep)"/><text x="${l-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" class="ax">${nf(v)}</text>`});
  if(target)s+=`<line x1="${l}" x2="${W-r}" y1="${Y(target).toFixed(1)}" y2="${Y(target).toFixed(1)}" stroke="var(--green)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  s+=`<path d="M${l},${H-b} ${pts.map((p,i)=>`L${X(i).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(' ')} L${X(pts.length-1).toFixed(1)},${H-b}Z" fill="var(--pink)" fill-opacity=".1"/>`;
  s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(p.kg).toFixed(1)).join(' ')}" fill="none" stroke="var(--pink)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const e=pts.length-1;s+=`<circle cx="${X(e).toFixed(1)}" cy="${Y(pts[e].kg).toFixed(1)}" r="4.5" fill="var(--pink)" stroke="var(--cell)" stroke-width="2"/>`;
  const dm=d=>d.slice(8)+'.'+d.slice(5,7)+'.';
  s+=`<text x="${l}" y="${H-5}" class="ax">${dm(pts[0].date)}</text><text x="${W-r}" y="${H-5}" text-anchor="end" class="ax">${dm(pts[e].date)}</text>`;
  return s+'</svg>'}

function greet(){const h=new Date().getHours();return h<5?'Gute Nacht':h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend'}
function ringVals(t){

  h+=goalsToday(t)+routines(t,R)+trackers(t);

function jetzt(){
  const t=T(),pl=planFor(t),n=nowMin(),dn=S.done[t]||{};if(!pl.length)return '';
  const cur=pl.find(b=>tm(b.start)<=n&&n<tm(b.start)+b.dur),later=pl.filter(b=>tm(b.start)>n&&!b.buffer);
  let h='<section class="card">';
  if(cur){const s=tm(cur.start),a=area(cur.area),g=cur.goal&&goal(cur.goal),on=!!dn[cur.id];
    h+=`<div class="jt"><span class="t2">Jetzt dran · bis ${ft(s+cur.dur)}</span><span class="jh">${esc(cur.title)}</span>${bar((n-s)/cur.dur,a?a.color:cur.buffer?'cyan':'tint')}</div>`;
    if(!cur.buffer)h+=`<div class="jact"><span class="t2">${on?'Gut gemacht.':g?`Wenn du fertig bist, trägt ein Tipp ${cur.dur} Min ein.`:'Tippe, wenn du fertig bist.'}</span><button class="pill${on?' on':''}" data-a="blk-done" data-id="${cur.id}">${on?'Erledigt':'Fertig'}</button></div>`}
  else if(later.length){const nx=later.shift();h+=`<div class="jt"><span class="t2">Als Nächstes um ${nx.start}</span><span class="jh">${esc(nx.title)}</span></div>`}

  const up=later.slice(0,2);
  if(up.length)h+=`<ul class="nxl">${up.map(b=>`<li><span class="tm">${b.start}</span><span>${esc(b.title)}</span></li>`).join('')}</ul>`;
  return h+`<div class="jact" style="margin-top:6px"><button class="lnk" data-a="push" data-k="tl">Ganzen Tag ansehen</button></div></section>`}
function goalsToday(t){
  let r='';
  S.areas.forEach(a=>{
    S.goals.filter(g=>g.area===a.id).forEach(g=>{
      if(g.type==='daily'){const v=lg(g.id,t),st=g.target>=30?15:5,ok=v>=g.target;
        r+=row({left:mini(v/g.target,a.color),t:esc(g.title),s:ok?`Geschafft · ${nf(v)} ${esc(g.unit)}`:`${nf(v)} von ${nf(g.target)} ${esc(g.unit)}${streak(g)>1?` · ${streak(g)} Tage in Folge`:''}`,
          r:`<button class="pill" data-a="log-add" data-id="${g.id}" data-k="${st}">+${st} ${esc(g.unit)}</button>`,a:'goal',id:g.id,cls:ok?'dim':''})}
      if(g.type==='proj')g.tasks.filter(x=>!x.d&&x.due&&x.due<=t).forEach(x=>{
        r+=row({left:`<button class="chk" data-a="task" data-id="${g.id}" data-k="${x.id}" aria-label="${esc(x.t)} erledigt"></button>`,t:esc(x.t),s:`${esc(g.title)} · ${x.due<t?'<span class="neg">überfällig</span>':'heute fällig'}`,a:'goal',id:g.id})})});
    if(a.kind==='read'){const b=S.books.find(x=>x.status==='Aktiv');
      if(b)r+=row({left:mini(b.read/b.pages,a.color),t:esc(b.title),s:`Seite ${b.read} von ${b.pages} · heute ${pagesPerDay(b)} Seiten`,r:'<button class="pill" data-a="qa" data-k="pages">+ Seiten</button>',a:'book',id:b.id})}});
  return r?grp('Deine Ziele heute',r,'Sortiert nach deinen Prioritäten. Die Reihenfolge änderst du unter Bereiche.'):''}
function routines(t,R){
  if(!R.hb.length)return '';
  const open=R.hb.filter(g=>!lg(g.id,t)),done=R.hb.filter(g=>lg(g.id,t));
  const hr=g=>{const on=!!lg(g.id,t),st=streak(g);return row({left:`<button class="chk${on?' on':''}" data-a="hab" data-id="${g.id}" aria-pressed="${on}" aria-label="${esc(g.title)} abhaken"></button>`,t:esc(g.title),s:st>1?`${st} Tage in Folge`:'',cls:on?'dim':''})};
  let r=open.map(hr).join('');
  if(!open.length)r+=row({left:ic('spark','cyan'),t:'Alle Routinen für heute erledigt'});
  if(done.length)r+=row({t:showDone?'Erledigte ausblenden':`${done.length} erledigt anzeigen`,a:'show-done',cls:'tint'})+(showDone?done.map(hr).join(''):'');
  return grp('Routinen',r,'',`<span class="t2">${R.hd} von ${R.hb.length}</span>`)}
function trackers(t){

function saveGoal(){
  if(!String(D.title||'').trim())return err('Bitte gib dem Ziel einen Titel.');
  const t=T(),g=clone(D),id=g.id||uid();delete g._err;
  ['target','start','cur'].forEach(k=>{if(g[k]!=null)g[k]=+g[k]||0});
  if(g.type==='daily'){if(!(g.target>0))return err('Das Tagesziel muss größer als 0 sein.');setLog(id,t,+g._today||0)}

  Object.keys(g).filter(k=>k[0]==='_').forEach(k=>delete g[k]);g.id=id;
  const i=S.goals.findIndex(x=>x.id===id);if(i>=0)S.goals[i]=g;else S.goals.push(g);done_(i>=0?'Ziel gespeichert':'Ziel angelegt')}

const A={
  tab:(el,k)=>{if(tab===k)stack[k]=[];tab=k;render();scrollTo(0,0)},
  back:()=>{stack[tab].pop();render();scrollTo(0,0)},
  push:(el,k)=>push({v:k}),
  area:(el,k,id)=>push({v:'area',id}),
  goal:(el,k,id)=>openGoal(id),
  'goal-new':(el,k)=>openGoal(null,k),
  'goal-del':(el,k,id)=>ask('Dieses Ziel und seine Einträge löschen?','Ziel löschen',()=>{const i=S.goals.findIndex(g=>g.id===id),g=S.goals[i],lgs=S.logs[id];S.goals.splice(i,1);delete S.logs[id];closeSheet();save();render();toast('Ziel gelöscht',()=>{S.goals.splice(i,0,g);if(lgs)S.logs[id]=lgs})}),
  hab:(el,k,id)=>{const t=T();setLog(id,t,lg(id,t)?0:1);save();render()},
  'log-add':(el,k,id)=>{const t=T();setLog(id,t,lg(id,t)+(+k));save();render()},

  'blk-done':(el,k,id)=>{const t=T(),b=planFor(t).find(x=>x.id===id);if(!b)return;S.done[t]=S.done[t]||{};const on=!S.done[t][id];

  'body-goals':()=>{D={sl:String(S.profile.sleepGoal).replace('.',','),tr:String(S.profile.trainGoal)};openSheet({title:'Körperziele',save:()=>{const a=num(D.sl),b=Math.round(num(D.tr)||0);if(!(a>0&&a<=24))return err('Bitte gib ein Schlafziel zwischen 0 und 24 Stunden ein.');if(!(b>0))return err('Bitte gib die Einheiten pro Woche ein.');S.profile.sleepGoal=a;S.profile.trainGoal=b;done_('Ziele gespeichert')},
    body:()=>grp('',fr('Schlaf pro Nacht (Std)',fi('sl',{mode:'decimal'}))+fr('Training pro Woche',fi('tr',{mode:'numeric'})))})},

  'kc-again':(el,k,id)=>{const x=S.kcal.find(k=>k.id===id);S.kcal.push({id:uid(),date:D.date||T(),name:x.name,kcal:x.kcal,meal:D.meal});done_(`${esc(x.name)} eingetragen`)},

function rmDemo(){
  const ids=S.rec.filter(r=>r.demo).map(r=>r.id);S.rec=S.rec.filter(r=>!r.demo);
  S.tx=S.tx.filter(x=>!x.demo&&!ids.includes(x.rec));
  ['kcal','weight','train','books'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));
  (S.demoKeys||[]).forEach(k=>{const [g,d]=k.split('|');if(g==='sleep')delete S.sleep[d];else if(S.logs[g])delete S.logs[g][d]});
  S.demoKeys=[];S.demo=false;S.done={}}
async function exportData(){
  const data=JSON.stringify(S,null,1),name='kompass-backup-'+T()+'.json';
  try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(dl){await dl.save({filename:name,data});toast('Backup gespeichert');return}}catch(e){if(e&&e.code==='declined')return}
  if(!window.claude){ // eigenständige App: Teilen-Menü (iPhone: „In Dateien sichern“) oder normaler Download
    try{const f=new File([data],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Kompass-Backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Backup gespeichert');return}catch(e){}
  }
  D={};openSheet({title:'Backup',body:()=>grp('',`<div class="row"><textarea class="fa" id="bk" rows="8" readonly>${esc(data)}</textarea></div>`+row({t:'Kopieren',a:'copy',cls:'tint center'}),'Kopiere den Text und speichere ihn als Datei mit der Endung .json, zum Beispiel in deinen Notizen oder in einer Cloud.')})}
A.copy=()=>{const t=$('#bk');try{navigator.clipboard.writeText(t.value).then(()=>toast('Kopiert'),()=>{t.select();toast('Text markiert – jetzt kopieren')})}catch(e){t.select();toast('Text markiert – jetzt kopieren')}};

/* ════════ EREIGNISSE ════════ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const a=el.dataset.a;if(!A[a])return;
  if(el.tagName!=='INPUT')e.preventDefault();
  A[a](el,el.dataset.k,el.dataset.id)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#ask').innerHTML)A['ask-x']();else if(SH)A['sh-x']();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.tap[role=button]')){e.preventDefault();e.target.click()}});
function bind(e){const el=e.target;
  if(el.dataset.f&&D){let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.t==='n')v=num(v);setPath(D,el.dataset.f,v);if(el.dataset.re&&e.type==='change')drawSheet()}
  if(el.dataset.s&&e.type==='change'){let v=el.value;if(el.dataset.t==='n')v=num(v);if(el.dataset.s==='profile.birthday'&&!v)return;setPath(S,el.dataset.s,v);save();render()}}
document.addEventListener('input',bind);document.addEventListener('change',bind);
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d||!d.v)throw 0;S=fromAny(d);runRec();save();render();toast('Backup geladen')}catch(x){toast('Diese Datei ist kein gültiges Kompass-Backup.')}e.target.value=''})});

/* ════════ START ════════ */
runRec();localSave();render();if(!S.seenIntro)setTimeout(()=>{if(!S.seenIntro&&!SH)openIntro()},350);
setInterval(()=>{if(!SH&&(tab==='heute'||top_()&&top_().v==='tl'))render()},60000);
/* Kontoweiter Speicher: hält Handy und Computer gleich, falls verfügbar */
(async()=>{try{
  if(!window.claude||!claude.use)return;const db=await claude.use('db'),u=await claude.use('user');if(!db||!u)return;
  const id=await u.id(),ref=db.doc('data/users/'+id+'/app'),snap=await ref.get(),r=snap.exists?snap.data():null;
  if(r&&r.json&&(r.ts||0)>(S.ts||0)){S=fromAny(JSON.parse(r.json));runRec();localSave()}
  syncRef=ref;syncOn=true;if(!r||(r.ts||0)<(S.ts||0)||(r.json&&JSON.parse(r.json).v!==2))save();render()
}catch(e){}})();
